[package]
name = "localsql_studio"
version = "0.1.0"
edition = "2021"
description = "LocalSQL Studio — treat Excel workbooks as databases and query them with zero-lag SQL"

# Binary target
[[bin]]
name = "localsql_studio"
path = "src/main.rs"

# Library target (for integration tests)
[lib]
name = "localsql_studio"
path = "src/lib.rs"

[dependencies]
# GUI Framework
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29.1"
egui_extras = { version = "0.29.1", features = ["default"] }

# Embedded SQL Database
duckdb = { version = "1.1.1", features = ["bundled", "chrono", "serde_json"] }

# Data Ingestion Parsers
calamine = "0.26.1"
csv = "1.3.0"

# OS File Dialogs
rfd = "0.15.0"

# Concurrency & Channels
crossbeam-channel = "0.5.13"

# Export & Serialization
rust_xlsxwriter = "0.70.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
strip = true
